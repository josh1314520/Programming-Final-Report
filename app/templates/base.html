<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒險者金庫 - 儀表板</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- 引入 FontAwesome 作為圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-shield-alt"></i> 冒險者金庫
        </div>
        <ul class="nav-links">
            <li><a href="/dashboard" {% if request.path == '/dashboard' or request.path == '/' %}class="active"{% endif %}>儀表板</a></li>
            <li><a href="/news" {% if request.path == '/news' %}class="active"{% endif %}>每日讀報</a></li>
            <li><a href="#">防具商店</a></li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
