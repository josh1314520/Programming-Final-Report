{% extends "base.html" %}

{% block title %}召喚祭壇 - 冒險者金庫{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
        <h2 class="text-white fw-extrabold mb-1"><i class="bi bi-stars text-warning me-2"></i>召喚祭壇</h2>
        <p class="text-secondary mb-0">消耗靈石開啟古老的虛空魔法陣，隨機召喚稀有的守護靈或神話級史詩裝備！</p>
    </div>
    <div class="d-flex gap-2">
        <div class="resource-badge badge-stones" style="font-size: 1rem; padding: 8px 18px;">
            <i class="bi bi-gem"></i> 靈石存量: <strong id="altar-stones">{{ player.soul_stones }}</strong>
        </div>
    </div>
</div>

<div class="row g-4 justify-content-center">
    <div class="col-xl-8">
        <div class="glass-panel p-5 text-center position-relative overflow-hidden" id="summon-card-container">
            <!-- 背景暗網與粒子 -->
            <div id="particle-overlay" class="position-absolute w-100 h-100 top-0 left-0" style="pointer-events: none; z-index: 1;"></div>
            
            <!-- 召喚魔法陣 -->
            <div class="summon-platform" id="summon-altar-platform">
                <div class="magic-circle-container" id="magic-circle">
                    <div class="magic-circle-outer"></div>
                    <div class="magic-circle-inner"></div>
                    <div class="magic-star"></div>
                    <div class="magic-star-reverse"></div>
                    <span class="summon-altar-core">🔱</span>
                </div>
                
                <h4 class="text-white fw-bold mb-1" id="altar-status-title">虛空星海召喚法陣</h4>
                <p class="text-secondary small mb-4" id="altar-status-desc">凝聚星辰之力，開啟星門與遠古英靈及神兵契約</p>
                
                <!-- 召喚按鈕 -->
                <div class="d-flex justify-content-center gap-3 w-100 max-w-md flex-wrap" id="summon-actions">
                    <button class="btn btn-lg btn-primary-glow px-4 py-3" onclick="triggerSummon(1)">
                        <i class="bi bi-magic me-1"></i> 單次召喚 (3 靈石)
                    </button>
                    <button class="btn btn-lg btn-primary-glow px-4 py-3" style="background: linear-gradient(135deg, #a770ef 0%, #cf8bf3 50%, #fdbb2d 100%); color: #fff; box-shadow: 0 4px 15px rgba(207, 139, 243, 0.4);" onclick="triggerSummon(10)">
                        <i class="bi bi-stars me-1"></i> 輝光十連抽 (25 靈石)
                    </button>
                </div>
            </div>
            
            <!-- 召喚成果揭示區 (初始隱藏，召喚後動態填入並展示) -->
            <div id="summon-reveal-platform" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary-subtle">
                    <h4 class="text-white fw-bold mb-0 text-start"><i class="bi bi-gift-fill text-warning me-2"></i>召喚契約成果</h4>
                    <button class="btn btn-sm btn-secondary-glass" onclick="resetSummonAltar()">
                        <i class="bi bi-arrow-repeat me-1"></i> 再次召喚
                    </button>
                </div>
                
                <p class="text-secondary small">點擊下方卡牌揭示您的召喚契約物件！</p>
                
                <!-- 卡牌放置區 -->
                <div class="draw-reveal-area" id="reveal-cards-container">
                    <!-- JS 動態渲染 -->
                </div>
                
                <div class="mt-5 text-center">
                    <button class="btn btn-lg btn-primary-glow px-5" onclick="resetSummonAltar()">
                        重回祭壇
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/summon_effect.js') }}"></script>
{% endblock %}
